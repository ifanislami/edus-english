name: Crawl and publish scheduled news

on:
  # Supabase Cron dispatches this workflow. GitHub no longer owns the schedule.
  workflow_dispatch:
    inputs:
      crawl:
        description: "Crawler to run"
        required: true
        type: choice
        default: republika-l1
        options:
          - republika-l1
          - sciencealert-l2
          - republika-l2
          - sciencealert-l1
          - dw-l2

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
      GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
      QWEN_MODEL: qwen3.8-max
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: inputs.crawl == 'republika-l1'
        run: node scripts/crawl-scheduled-news.mjs
        env:
          CRAWL_SOURCE: Republika
          CRAWL_LEVEL: "1"
          CRAWL_FEED: https://www.republika.co.id/rss/
      - if: inputs.crawl == 'sciencealert-l2'
        run: node scripts/crawl-scheduled-news.mjs
        env:
          CRAWL_SOURCE: ScienceAlert
          CRAWL_LEVEL: "2"
          CRAWL_FEED: https://www.sciencealert.com/?format=feed&id=1%3Athe-latest&option=com_obrss&task=feed
      - if: inputs.crawl == 'republika-l2'
        run: node scripts/crawl-scheduled-news.mjs
        env:
          CRAWL_SOURCE: Republika
          CRAWL_LEVEL: "2"
          CRAWL_FEED: https://www.republika.co.id/rss/
      - if: inputs.crawl == 'sciencealert-l1'
        run: node scripts/crawl-scheduled-news.mjs
        env:
          CRAWL_SOURCE: ScienceAlert
          CRAWL_LEVEL: "1"
          CRAWL_FEED: https://www.sciencealert.com/?format=feed&id=1%3Athe-latest&option=com_obrss&task=feed
      - if: inputs.crawl == 'dw-l2'
        run: node scripts/crawl-scheduled-news.mjs
        env:
          CRAWL_SOURCE: DW Indonesia
          CRAWL_LEVEL: "2"
          CRAWL_FEED: https://rss.dw.com/xml/rss-id-all
